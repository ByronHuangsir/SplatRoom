<svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Surface plane -->
  <rect x="6" y="12" width="26" height="3" rx="1" fill="currentColor" opacity="0.3"/>
  <!-- Surface arrows (normals) -->
  <line x1="11" y1="12" x2="11" y2="5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="19" y1="12" x2="19" y2="3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="27" y1="12" x2="27" y2="5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Arrow heads -->
  <polyline points="9.5,7 11,4 12.5,7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="17.5,5 19,2 20.5,5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="25.5,7 27,4 28.5,7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Edge sharpening indicator -->
  <rect x="5" y="25" width="28" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="3 2"/>
</svg>
