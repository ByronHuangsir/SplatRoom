<svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left zipper track -->
  <line x1="3.5" y1="1.5" x2="3.5" y2="12.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Right zipper track -->
  <line x1="10.5" y1="1.5" x2="10.5" y2="12.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Zipper teeth (crossing) -->
  <line x1="3.5" y1="3" x2="10.5" y2="4" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="3.5" y1="5" x2="10.5" y2="6" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="3.5" y1="7" x2="10.5" y2="8" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="3.5" y1="9" x2="10.5" y2="10" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Zipper slider at top -->
  <rect x="2" y="1" width="10" height="2.5" rx="1.25" fill="currentColor"/>
  <!-- Zipper pull tab -->
  <circle cx="7" cy="0.8" r="0.8" fill="currentColor"/>
</svg>
