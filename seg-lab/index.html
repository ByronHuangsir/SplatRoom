<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SplatRoom · 物体分割实验台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%237a4a1e'/%3E%3C/svg%3E">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #16161a; color: #e8e8ea; }
    #app { position: absolute; inset: 0; display: block; }
    /* selection marquee */
    #marquee { position: absolute; border: 1px solid #ff9d3c; background: rgba(255, 157, 60, 0.12); display: none; pointer-events: none; }
    /* prompt disk (click radius) */
    #promptDisk { position: absolute; border: 2px solid #5fd0ff; border-radius: 50%; background: rgba(95, 208, 255, 0.10); display: none; pointer-events: none; }
    #ui { position: absolute; top: 12px; left: 12px; width: 300px; background: rgba(28, 28, 34, 0.92); border: 1px solid #33333c; border-radius: 10px; padding: 12px 14px; font-size: 13px; max-height: calc(100% - 24px); overflow-y: auto; }
    #ui h1 { font-size: 14px; font-weight: 500; margin-bottom: 10px; color: #ffb066; }
    #ui .section { border-top: 1px solid #33333c; padding-top: 8px; margin-top: 10px; }
    #ui .row { display: flex; align-items: center; justify-content: space-between; margin: 5px 0; gap: 8px; }
    #ui label { color: #b8b8c0; }
    #ui input[type="range"] { flex: 1; min-width: 0; }
    #ui input[type="color"] { width: 40px; height: 24px; border: none; background: none; cursor: pointer; }
    #ui button { flex: 1; padding: 6px 8px; border: 1px solid #44444f; background: #23232b; color: #e8e8ea; border-radius: 6px; cursor: pointer; font-size: 12px; }
    #ui button:hover { background: #2e2e38; }
    #ui button.primary { background: #7a4a1e; border-color: #9a6a2e; }
    #ui button.primary:hover { background: #8f5a26; }
    #ui .hint { color: #808088; font-size: 11px; margin-top: 6px; line-height: 1.5; }
    #ui .stat { color: #ffd9a8; font-size: 12px; margin-top: 6px; min-height: 16px; }
    #modeBar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; background: rgba(28,28,34,0.92); border: 1px solid #33333c; border-radius: 10px; padding: 6px; }
    #modeBar button { padding: 5px 12px; border: 1px solid #44444f; background: #23232b; color: #b8b8c0; border-radius: 6px; cursor: pointer; font-size: 12px; }
    #modeBar button.active { background: #7a4a1e; border-color: #9a6a2e; color: #fff; }
    /* drag & drop hint */
    #dropHint { position: absolute; inset: 0; display: none; background: rgba(20,20,26,0.78); border: 3px dashed #ff9d3c; color: #ffd9a8; align-items: center; justify-content: center; font-size: 20px; z-index: 50; pointer-events: none; }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="marquee"></div>
<div id="promptDisk"></div>
<div id="dropHint">松开以加载 .ply 高斯模型</div>

<div id="modeBar">
    <button data-mode="click" class="active">点选物体</button>
    <button data-mode="box">框选区域</button>
    <button data-mode="orbit">视角旋转</button>
</div>

<div id="ui">
    <h1>物体分割实验台（方案B · 2D→3D 投影）</h1>
    <div class="section">
        <div class="row" style="gap:6px;">
            <input type="file" id="fileInput" accept=".ply" style="font-size:11px; flex:1; min-width:0; color:#b8b8c0;">
        </div>
        <div class="row" style="gap:6px;">
            <input type="text" id="fileUrl" placeholder="粘贴 .ply 链接（含 http）" style="flex:1; min-width:0; padding:5px; border:1px solid #44444f; background:#1a1a20; color:#e8e8ea; border-radius:5px; font-size:11px;">
            <button id="btnLoadUrl">加载</button>
        </div>
        <div class="hint">也可把 .ply 直接拖到画面上加载。默认载入内置示例 scene.ply。</div>
    </div>
    <div class="section">
        <div class="row"><label>点击半径(px)</label><input type="range" id="clickR" min="4" max="80" step="2" value="24"></div>
        <div class="row"><label>深度容差(%)</label><input type="range" id="depthTol" min="0" max="20" step="1" value="3"></div>
    </div>
    <div class="section">
        <div class="row"><button class="primary" id="btnRun">重新分割</button></div>
        <div class="row">
            <button id="btnHideBg">隐藏背景</button>
            <button id="btnExport">导出子模型</button>
        </div>
        <div class="row"><button id="btnReset">重置</button></div>
    </div>
    <div class="stat" id="stat"></div>
    <div class="hint">
        <b>点选物体</b>：左键点物体表面（蓝色圈为提示范围）→ 自动分割并隐藏背景<br>
        <b>框选区域</b>：左键拖框 → 框内物体被选中<br>
        <b>视角旋转</b>：拖拽旋转 / 滚轮缩放 / 右键平移<br>
        <b>深度容差</b>：调大可多保留物体「后方」高斯（防止边缘漏选），调小更严格<br>
        <b>隐藏背景</b>：切换显隐；<b>导出子模型</b>：下载选中高斯 .ply
    </div>
</div>

<script src="../../node_modules/playcanvas/build/playcanvas.min.js"></script>
<script src="seg-app.js?v=14"></script>
<script>document.title = 'seg-lab v=14 · ' + document.title;</script>
</body>
</html>
